name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate version tag
        id: version
        run: python -m scripts.release prepare "$env:RELEASE_TAG"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Compile EXE with Nuitka
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python build.py --compiler msvc --version "$env:RELEASE_VERSION" --jobs 4

      - name: Check compiled EXE
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m scripts.release smoke "$env:RELEASE_TAG"

      - name: Package ZIP and checksums
        run: python -m scripts.release package "$env:RELEASE_TAG"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/SrunGuard-*-windows-x64.zip
            dist/SrunGuard-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/nuitka/compilation-report.xml
            build/release-selftest.json
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    name: Prepare GitHub Release draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: dist

      - name: Verify ZIP checksums
        working-directory: dist
        run: sha256sum --check -- *.zip.sha256

      - name: Create or update release draft
        shell: bash
        run: |
          set -euo pipefail
          # Only update drafts. Never modify a release already published manually.
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published; refusing to overwrite its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "Srun Guard $RELEASE_VERSION" \
              --generate-notes \
              --prerelease="$RELEASE_PRERELEASE"
          fi
          # Re-runs may replace draft assets, but publishing is always manual.
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 --clobber
          echo "### Release draft ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: $RELEASE_TAG. Review the ZIP and notes in GitHub Releases, then click Publish release." >> "$GITHUB_STEP_SUMMARY"
